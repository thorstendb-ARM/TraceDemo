<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title description">
  <title id="title">Problem description and motivation for data trace</title>
  <desc id="description">The memory panel focuses on varWorker2 at address 0x200000D0, with the arrWorker1 memory details hidden. Two concurrent threads interleave on one CPU core. Worker2 writes incrementing data to varWorker2, while worker1 fills a buffer with data. The variable varWorker2 is occasionally overwritten with an unexpected value.</desc>

  <!-- Basic SVG shapes and system fonts keep the graphic editable and portable. -->
  <rect width="1600" height="900" fill="#ffffff"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#183247">
    <text x="76" y="57" font-size="18" font-weight="700" letter-spacing="2.4" fill="#557187">DATA TRACE DEMO</text>
    <text x="76" y="112" font-size="44" font-weight="700">Two worker threads and an unexpected overwrite</text>
    <text x="76" y="153" font-size="25" fill="#557187">varWorker2 is occasionally overwritten with an unexpected value.</text>

    <!-- RAM layout: every rectangle represents exactly four adjacent bytes. -->
    <rect x="76" y="200" width="850" height="555" rx="20" fill="#f6f8fb"/>
    <text x="120" y="231" font-size="17" font-weight="700" letter-spacing="1.1" fill="#557187">RAM ADDRESS</text>
    <text x="451" y="231" text-anchor="middle" font-size="17" font-weight="700" letter-spacing="1.1" fill="#557187">VALUE</text>
    <text x="579" y="231" font-size="17" font-weight="700" letter-spacing="1.1" fill="#557187">VARIABLE</text>

    <!-- Hide the array details in this presentation variant. -->
    <g id="array-memory-details" display="none">
      <!-- Addresses increase downward; there is no gap between the objects. -->
      <path d="M 101 262 V 662" fill="none" stroke="#90a4b5" stroke-width="2"/>
      <path d="M 96 655 L 101 667 L 106 655 Z" fill="#90a4b5"/>

      <g font-family="'Courier New', Courier, monospace" font-size="21" fill="#557187" text-anchor="end">
        <text x="326" y="282">0x200000B0</text>
        <text x="326" y="330">0x200000B4</text>
        <text x="326" y="378">0x200000B8</text>
        <text x="326" y="426">0x200000BC</text>
        <text x="326" y="474">0x200000C0</text>
        <text x="326" y="522">0x200000C4</text>
        <text x="326" y="570">0x200000C8</text>
        <text x="326" y="618">0x200000CC</text>
      </g>

      <g fill="#e3effc" stroke="#98bbdc" stroke-width="2">
        <rect x="356" y="250" width="190" height="48"/>
        <rect x="356" y="298" width="190" height="48"/>
        <rect x="356" y="346" width="190" height="48"/>
        <rect x="356" y="394" width="190" height="48"/>
        <rect x="356" y="442" width="190" height="48"/>
        <rect x="356" y="490" width="190" height="48"/>
        <rect x="356" y="538" width="190" height="48"/>
        <rect x="356" y="586" width="190" height="48"/>
      </g>
      <g font-family="'Courier New', Courier, monospace" font-size="27" text-anchor="middle" fill="#205787">
        <text x="451" y="283">0</text>
        <text x="451" y="331">1</text>
        <text x="451" y="379">2</text>
        <text x="451" y="427">3</text>
        <text x="451" y="475">4</text>
        <text x="451" y="523">5</text>
        <text x="451" y="571">6</text>
        <text x="451" y="619">7</text>
      </g>
      <g font-family="'Courier New', Courier, monospace" font-size="25">
        <text x="579" y="282">arrWorker1[0]</text>
        <text x="579" y="330">arrWorker1[1]</text>
        <text x="579" y="378">arrWorker1[2]</text>
        <text x="579" y="426">arrWorker1[3]</text>
        <text x="579" y="474">arrWorker1[4]</text>
        <text x="579" y="522">arrWorker1[5]</text>
        <text x="579" y="570">arrWorker1[6]</text>
        <text x="579" y="618">arrWorker1[7]</text>
      </g>
    </g>

    <text x="326" y="666" font-family="'Courier New', Courier, monospace" font-size="21" text-anchor="end" font-weight="700" fill="#a44718">0x200000D0</text>

    <!-- Highlight the victim's entire row; the memory cell still has the same size. -->
    <rect x="547" y="634" width="379" height="48" fill="#fff0dd"/>
    <rect x="356" y="634" width="190" height="48" fill="#fff0dd" stroke="#d34a36" stroke-width="3"/>
    <text x="451" y="668" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="32" font-weight="700" fill="#be3324">8</text>
    <text x="579" y="667" font-family="'Courier New', Courier, monospace" font-size="28" font-weight="700" fill="#a44718">varWorker2</text>

    <g id="array-layout-notes" display="none">
      <text x="120" y="720" font-size="21" fill="#557187">8 array elements × 4 bytes = 32 bytes</text>
      <text x="579" y="720" font-size="21" fill="#557187">Valid array indices: 0–7</text>
    </g>

    <!-- Concurrent lifetimes, with non-overlapping execution on a single core.
         This is an unscaled excerpt, not a complete scheduling trace. -->
    <rect x="990" y="204" width="534" height="139" rx="14" fill="#f6f8fb"/>
    <text x="1008" y="231" font-size="22" font-weight="700">Concurrent threads</text>
    <text x="1008" y="255" font-size="17" fill="#557187">Interleaved on one core · schematic excerpt</text>
    <text x="1008" y="283" font-size="18" font-weight="700" fill="#205787">worker1</text>
    <text x="1008" y="312" font-size="18" font-weight="700" fill="#205787">worker2</text>
    <path d="M 1126 277 H 1472 M 1126 306 H 1472" fill="none" stroke="#c5d2de" stroke-width="2"/>
    <g fill="#205787">
      <rect x="1140" y="269" width="16" height="16" rx="3"/>
      <rect x="1240" y="269" width="16" height="16" rx="3"/>
      <rect x="1340" y="269" width="16" height="16" rx="3"/>
    </g>
    <g fill="#d8a44c">
      <rect x="1164" y="298" width="16" height="16" rx="3"/>
      <rect x="1264" y="298" width="16" height="16" rx="3"/>
      <rect x="1364" y="298" width="16" height="16" rx="3"/>
    </g>
    <text x="1484" y="283" font-size="20" fill="#557187">…</text>
    <text x="1484" y="312" font-size="20" fill="#557187">…</text>
    <text x="1008" y="334" font-size="15" fill="#557187">Each write is followed by a 100 ms sleep</text>
    <text x="1453" y="334" font-size="15" fill="#557187">time →</text>

    <!-- Legitimate writer. -->
    <rect x="990" y="360" width="534" height="150" rx="16" fill="#fff0dd" stroke="#c4d9ec" stroke-width="2"/>
    <text x="1020" y="393" font-size="24" font-weight="700" fill="#205787">worker2</text>
    <text x="1020" y="433" font-size="23">writes data to varWorker2:</text>
    <text x="1020" y="480" font-size="29" font-family="'Courier New', Courier, monospace" fill="#205787">10 → 20 → 30 → …</text>

    <!-- Buffer writer. -->
    <rect x="990" y="530" width="534" height="225" rx="16" fill="#e3effc" stroke="#c4d9ec" stroke-width="2"/>
    <text x="1020" y="562" font-size="24" font-weight="700" fill="#205787">worker1</text>
    <text x="1020" y="601" font-size="24" fill="#000000">writes data to buffer</text>

    <!-- Trace configuration for investigating the unexpected value. -->
    <rect x="76" y="787" width="1448" height="73" rx="14" fill="#183247"/>
    <text x="102" y="812" font-size="17" font-weight="700" fill="#9ec8ee">Trace config: varWorker2</text>

  </g>
</svg>
