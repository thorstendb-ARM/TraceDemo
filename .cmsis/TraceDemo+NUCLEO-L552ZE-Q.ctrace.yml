# Resolve the watch address from the current ELF after every build.
ctrace:
  setup:
    - core: Cortex-M33
      timestamps:
        clock: 4000000
        itm-prescaler: 1
      data:
        - location: varWorker2
          access: W
          size: 4
          output: PC+value
      itm:
        enable: 0x00000000
      pcsampling:
        period: 0
      synchronization:
        DWT: 16M
        sync-on-run: true
